<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №4</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .box {
            background-color: #f8f9fa;
            border: 2px solid #343a40;
            border-radius: 6px;
            padding: 20px;
            text-align: center;
            font-weight: bold;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
        }
        .nested-box {
            background-color: #e9ecef;
            border: 2px dashed #0d6efd;
            color: #0d6efd;
        }
    </style>
</head>
<body class="bg-light py-5">

    <div class="container bg-white p-4 shadow-sm rounded">
        <h2 class="text-center mb-5">Лабораторна робота: Адаптивна сітка Bootstrap</h2>

        <div class="row g-3 mb-5 justify-content-md-between">
            <div class="col-6 col-md-5">
                <div class="box">Ряд 1 - Блок 1</div>
            </div>
            <div class="col-6 col-md-5">
                <div class="box">Ряд 1 - Блок 2</div>
            </div>
        </div>

        <div class="row g-3 mb-5">
            <div class="col-12">
                <div class="box bg-light" style="border-color: #ffc107;">
                    <p class="mb-3 text-muted">Ряд 2 - Головний блок</p>
                    <div class="row justify-content-between g-2">
                        <div class="col-5 d-none d-md-block">
                            <div class="box nested-box">Вкладений блок 1</div>
                        </div>
                        <div class="col-5 col-md-5">
                            <div class="box nested-box">Вкладений block 2</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-3">
            <div class="col-7">
                <div class="box">Ряд 3 - Блок 1 (7 колонок)</div>
            </div>
            <div class="col-2 d-none d-sm-block">
                <div class="box text-danger" style="border-color: #dc3545;">Блок 2</div>
            </div>
            <div class="col-3 col-sm-3 offset-2 offset-sm-0">
                <div class="box">Блок 3</div>
            </div>
        </div>

    </div>

</body>
</html>
